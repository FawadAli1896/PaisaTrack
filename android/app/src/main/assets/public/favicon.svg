<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Wallet Body Shape -->
  <rect x="96" y="144" width="320" height="224" rx="36" fill="url(#cardGrad)" opacity="0.95" />
  <!-- Wallet Flap & Accent -->
  <rect x="256" y="216" width="160" height="80" rx="24" fill="#0f172a" />
  <!-- Golden Clasp Coin -->
  <circle cx="360" cy="256" r="16" fill="#fbbf24" stroke="#d97706" stroke-width="4" />
  <!-- Currency symbol "Rs" text or stylised wave -->
  <path d="M140 256h60M170 226v60" stroke="#047857" stroke-width="12" stroke-linecap="round" />
</svg>